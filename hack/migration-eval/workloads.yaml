# ==============================================================================
# Workloads for P1 (Named Port Resolution)
# ==============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  namespace: eval-p1
  labels:
    app.kubernetes.io/name: payment-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-processor
    spec:
      containers:
      - name: payment-api
        image: nilebox/prometheus-example-app@sha256:dab60d038c5d6915af5bcbe5f0279a22b95a8c8be254153e22d7cd81b21b84c5
        ports:
        - name: metrics
          containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: eval-p1
  labels:
    app: payment-processor
spec:
  selector:
    app.kubernetes.io/name: payment-processor
  ports:
  - name: metrics
    port: 80
    targetPort: 8080

