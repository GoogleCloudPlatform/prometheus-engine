processor:
  ignoreTypes:
    - ".*List$"
    - "OperatorConfigValidator$"
    - "MonitoringCRD$"
    - "PodMonitoringCRD$"
    - "PrometheusSecretConfigs$"
  ignoreFields:
    - "TypeMeta$"

render:
  kubernetesVersion: "1.35"
  knownTypes:
    - name: IntOrString
      package: k8s.io/apimachinery/pkg/util/intstr
      link: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.35/#intorstring-intstr-util
    - name: LabelSet
      package: github.com/prometheus/common/model
      link: https://pkg.go.dev/github.com/prometheus/common/model#LabelSet
