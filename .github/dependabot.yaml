version: 2
updates:
  # Main branch configuration
  - package-ecosystem: docker
    directories:
      - /cmd/config-reloader
      - /cmd/datasource-syncer
      - /cmd/frontend
      - /cmd/operator
      - /cmd/rule-evaluator
      - /examples/instrumentation/go-synthetic
      - /hack
    ignore:
      # Stop upgrading prometheus-engine images as those are handled by manifest command (e.g. make regen)
      - dependency-name: "gke.gcr.io/prometheus-engine/*"
      - dependency-name: "gke-release/prometheus-engine/*"
      - dependency-name: "gcr.io/gke-release/prometheus-engine/*"
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      docker:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      tools:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /
    ignore:
      # Skip Prometheus as we need to have it pinned carefully.
      - dependency-name: "github.com/prometheus/prometheus"
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # Group dep updates into one PR as single update already updates co-located deps.
      deps:
        patterns:
          - "*"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      # Attempt to group dep updates for k8s as they typically break by assuming
      # all k8s modules are upgraded in the same time.
      k8s-deps:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
    cooldown:
      default-days: 7

  # Config for release/0.19
