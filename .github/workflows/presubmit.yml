name: Presubmit
on:
  push:
    branches:
      - main
      - release-.*
  pull_request:
env:
  # GCM integration tests print this when skipped. Keep it in sync with e2e/main_test.go,
  # cmd/frontend/frontend_image_test.go and the test-script-gcm Makefile target.
  GCM_SKIP_MARKER: GCM integration test skipped
jobs:
  bin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build go images
        run: make bin
  conform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: siderolabs/conform@6380738b7fdfc68b208ce0674c4ac1ba314ba600 # v0.1.0-alpha.27
        name: Conform Action
  golangci-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 'stable'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.13.1
          skip-cache: true
          args: --timeout=5m --verbose
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 'stable'
          cache: false
      - name: Check format and autogenerated files
        run: CHECK=1 make regen
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        # Fetch the git tree so we can call `git` commands to validate the tag.
        # TODO(TheSpiritXIII): Remove this when debug.ReadBuildInfo() is fixed.
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run unit tests
        run: make test
  test-script-gcm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run example/script GCM tests
        shell: bash
        env:
          GCM_SECRET: ${{ secrets.GCM_SECRET }}
        run: make test-script-gcm 2>&1 | tee "${RUNNER_TEMP}/test.log"
      - name: Collect skipped GCM tests
        if: ${{ !cancelled() }}
        run: grep -F "${GCM_SKIP_MARKER}" "${RUNNER_TEMP}/test.log" > "${RUNNER_TEMP}/gcm-skips.txt" || rm -f "${RUNNER_TEMP}/gcm-skips.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: gcm-skips-test-script-gcm
          path: ${{ runner.temp }}/gcm-skips.txt
          if-no-files-found: ignore
          retention-days: 1
  image-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Run container image tests
      shell: bash
      env:
        GCM_SECRET: ${{ secrets.GCM_SECRET }}
      run: make image-test 2>&1 | tee "${RUNNER_TEMP}/test.log"
    - name: Collect skipped GCM tests
      if: ${{ !cancelled() }}
      run: grep -F "${GCM_SKIP_MARKER}" "${RUNNER_TEMP}/test.log" > "${RUNNER_TEMP}/gcm-skips.txt" || rm -f "${RUNNER_TEMP}/gcm-skips.txt"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: ${{ !cancelled() }}
      with:
        name: gcm-skips-image-test
        path: ${{ runner.temp }}/gcm-skips.txt
        if-no-files-found: ignore
        retention-days: 1
  e2e-testruns:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      testrun: ${{ steps.set-testruns.outputs.testrun }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: set-testruns
        run: echo "testrun=$(go test ./e2e/... -list=. | grep -E 'Test*' | jq -R -s -c 'split("\n")[:-1] | map("^" + . + "$")')" >> $GITHUB_OUTPUT
  e2e-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [e2e-testruns]
    strategy:
      fail-fast: false
      matrix:
        testrun: ${{fromJson(needs.e2e-testruns.outputs.testrun)}}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run e2e (with GCM)
        shell: bash
        env:
          GCM_SECRET: ${{ secrets.GCM_SECRET }}
          MATRIX_TESTRUN: ${{matrix.testrun}}
        run: TEST_RUN=${MATRIX_TESTRUN} make e2e 2>&1 | tee "${RUNNER_TEMP}/test.log"
      - name: Collect skipped GCM tests
        if: ${{ !cancelled() }}
        run: grep -F "${GCM_SKIP_MARKER}" "${RUNNER_TEMP}/test.log" > "${RUNNER_TEMP}/gcm-skips.txt" || rm -f "${RUNNER_TEMP}/gcm-skips.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: gcm-skips-e2e-test-${{ strategy.job-index }}
          path: ${{ runner.temp }}/gcm-skips.txt
          if-no-files-found: ignore
          retention-days: 1
  # GCM_SECRET is not populated for external contributors or fork based PRs. This means
  # that certain integration tests against production GCM will be skipped. This check
  # will fail to indicate that GCM integration tests are skipped (the jobs above upload
  # lines with GCM_SKIP_MARKER as gcm-skips-* artifacts). Maintainers can then decide
  # if an external change is worth redoing with extra tests or if it's fine to skip.
  # It's intentionally not a required check.
  gcm-skip-check:
    needs: [test-script-gcm, image-test, e2e-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gcm-skips-*
          path: ${{ runner.temp }}/gcm-skips
      - name: Fail if any GCM integration test was skipped
        run: |
          skips=$(find "${RUNNER_TEMP}/gcm-skips" -type f -exec cat {} + 2>/dev/null | sort || true)
          if [[ -z "${skips}" ]]; then
            echo "No GCM integration tests were skipped."
            exit 0
          fi
          echo "${skips}"
          echo "::error title=GCM integration tests skipped::$(wc -l <<< "${skips}") GCM integration test(s) were skipped, e.g. because GCM_SECRET is not available to PRs from forks. See the job summary."
          { echo "Skipped GCM integration tests:"; echo '```'; echo "${skips}"; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
          exit 1
