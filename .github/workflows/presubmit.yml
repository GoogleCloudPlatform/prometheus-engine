name: Presubmit
on:
  push:
    branches:
      - main
      - release-.*
  pull_request:
jobs:
  bin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build go images
        run: make bin
  conform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: siderolabs/conform@6380738b7fdfc68b208ce0674c4ac1ba314ba600 # v0.1.0-alpha.27
        name: Conform Action
  golangci-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 'stable'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.13.1
          skip-cache: true
          args: --timeout=5m --verbose
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 'stable'
          cache: false
      - name: Check format and autogenerated files
        run: CHECK=1 make regen
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        # Fetch the git tree so we can call `git` commands to validate the tag.
        # TODO(TheSpiritXIII): Remove this when debug.ReadBuildInfo() is fixed.
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run unit tests
        run: make test
  test-script-gcm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run example/script GCM tests
        env:
          GCM_SECRET: ${{ secrets.GCM_SECRET }}
        run: make test-script-gcm
  image-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Run container image tests
      env:
        GCM_SECRET: ${{ secrets.GCM_SECRET }}
      run: make image-test
  e2e-testruns:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      testrun: ${{ steps.set-testruns.outputs.testrun }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: set-testruns
        run: echo "testrun=$(go test ./e2e/... -list=. | grep -E 'Test*' | jq -R -s -c 'split("\n")[:-1] | map("^" + . + "$")')" >> $GITHUB_OUTPUT
  e2e-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [e2e-testruns]
    strategy:
      fail-fast: false
      matrix:
        testrun: ${{fromJson(needs.e2e-testruns.outputs.testrun)}}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run e2e (with GCM)
        env:
          GCM_SECRET: ${{ secrets.GCM_SECRET }}
          MATRIX_TESTRUN: ${{matrix.testrun}}
        run: TEST_RUN=${MATRIX_TESTRUN} make e2e
  gcm-skip-check:
    # GCM_SECRET is not populated for external contributors or fork based PRs. This means that
    # certain integration tests against production GCM will be skipped. This check will fail to
    # indicate that GCM integration tests are skipped. Maintainers can then decide if an external
    # change is worth redoing with extra tests or if it's fine to skip.
    #
    # Skipped GCM integration tests print a "GCM integration test skipped" warning, so the
    # workflow run summary lists them. It's not a required check.
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if GCM_SECRET is not available
        env:
          GCM_SECRET: ${{ secrets.GCM_SECRET }}
        run: |
          if [[ -z "${GCM_SECRET}" ]]; then
            echo "::error title=GCM integration tests skipped::GCM_SECRET is not available (e.g. for PRs from forks), so GCM integration tests are skipped. See the 'GCM integration test skipped' warnings in the workflow run summary for the list."
            exit 1
          fi
          echo "GCM_SECRET is available, GCM integration tests will run."
