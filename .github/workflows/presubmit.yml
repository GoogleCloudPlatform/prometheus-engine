name: Presubmit
on:
  push:
    branches:
      - main
      - release-.*
  pull_request:
jobs:
  bin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build go images
        run: make bin
  conform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: siderolabs/conform@cfdb3cce90daece912e6a5cb3f20b2316a78a5bf # v0.1.0-alpha.31
        name: Conform Action
  golangci-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          skip-cache: true
          args: --timeout=5m --verbose
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          cache: false
      - name: Check format and autogenerated files
        run: CHECK=1 make regen
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Fetch the git tree so we can call `git` commands to validate the tag.
        # TODO(TheSpiritXIII): Remove this when debug.ReadBuildInfo() is fixed.
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run unit tests
        run: make test
  e2e-testruns:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      testrun: ${{ steps.set-testruns.outputs.testrun }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: set-testruns
        run: |
          GCM_TESTS=$(yq -o=json '.jobs.gcm-e2e-test.strategy.matrix.testrun' .github/workflows/gcm-tests.yml)
          echo "testrun=$(go test ./e2e/... -list=. | grep -E '^Test' | jq -R -s -c --argjson gcm "${GCM_TESTS}" 'split("\n")[:-1] | map("^" + . + "$") - $gcm')" >> "${GITHUB_OUTPUT}"
  e2e-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [e2e-testruns]
    strategy:
      fail-fast: false
      matrix:
        testrun: ${{fromJson(needs.e2e-testruns.outputs.testrun)}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Runs with -skip-gcm; GCM validation lives in gcm-tests.yml.
      - name: Run e2e
        env:
          MATRIX_TESTRUN: ${{matrix.testrun}}
        run: TEST_RUN=${MATRIX_TESTRUN} make e2e
  gcm-skip-check:
    # GCM_SECRET is not populated for external contributors or fork based PRs. This means that
    # certain integration tests against production GCM will be skipped. This check will fail to
    # indicate that GCM integration tests are skipped. Maintainers can then decide if an external
    # change is worth redoing with extra tests or if it's fine to skip.
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if GCM_SECRET is not available
        env:
          GCM_SECRET: ${{ secrets.GCM_SECRET }}
        run: |
          if [[ -z "${GCM_SECRET}" ]]; then
            echo "::error title=GCM integration tests skipped::GCM_SECRET is not available, so GCM integration tests are skipped." \
              "This error is for maintainer information only -- nothing can be done by the contributor to pass it." \
              "MAINTAINERS: Ignore if the change is trivial and does not benefit from the GCM integration testing." \
              "Otherwise maintainers have to copy the PR to a branch in this repository and open a new PR from it to trigger the extra test cases."
            exit 1
          fi
          echo "GCM_SECRET is available, GCM integration tests will run."
