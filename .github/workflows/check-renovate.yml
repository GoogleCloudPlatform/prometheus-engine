name: Renovate
on:
  push:
    branches:
      - main
    paths:
      - .github/renovate.json5
      - hack/test-renovate.js
      - .github/workflows/check-renovate.yml
  pull_request:
    paths:
      - .github/renovate.json5
      - hack/test-renovate.js
      - .github/workflows/check-renovate.yml
jobs:
  check-renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate Renovate configuration and run behavioral regression tests
        run: make check-renovate
permissions: {}
