# Simplified Collector Pod with 0.18 (non-streaming) config-reloader on the default (4k page size) node pool.
apiVersion: v1
kind: Pod
metadata:
  name: collector-default-018
  namespace: config-reloader-bench
  labels:
    app: collector
    bench: config-reloader
    reloader_version: v0.18-buffered
    node_type: default-4k
spec:
  nodeSelector:
    cloud.google.com/gke-nodepool: default-pool
  containers:
  - name: config-reloader
    image: gke.gcr.io/prometheus-engine/config-reloader:v0.18.2-gke.1
    args:
    - --config-file=/prometheus/config/config.yaml.gz
    - --config-file-output=/prometheus/config_out/config.yaml
    - --reload-url=http://127.0.0.1:19090/-/reload
    - --ready-url=http://127.0.0.1:19090/-/ready
    - --listen-address=:19091
    env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: spec.nodeName
    ports:
    - name: cfg-rel-ins
      protocol: TCP
      containerPort: 19091
    resources:
      requests:
        cpu: 1m
        memory: 12Mi
      # Set to 256Mi so large config reloads (e.g. 8,500 jobs) can be measured without
      # immediate OOMKill; change to 32Mi to test OOMKill reproduction.
      limits:
        memory: 256Mi
    volumeMounts:
    - name: config
      mountPath: /prometheus/config
      readOnly: true
    - name: config-out
      mountPath: /prometheus/config_out
  # Lightweight Prometheus responder with --export.disable and a 2-line noop config so
  # http://127.0.0.1:19090/-/ready and /-/reload return 200 OK without sending any data
  # or consuming memory when config-reloader decompresses huge configs.
  - name: prometheus-noop
    image: gke.gcr.io/prometheus-engine/prometheus:v2.53.5-gmp.2-gke.2
    args:
    - --config.file=/prometheus/config/noop-prom.yaml
    - --storage.tsdb.path=/prometheus/data
    - --web.enable-lifecycle
    - --export.disable
    - --web.listen-address=127.0.0.1:19090
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 128Mi
    volumeMounts:
    - name: config
      mountPath: /prometheus/config
      readOnly: true
    - name: data
      mountPath: /prometheus/data
  volumes:
  - name: config
    configMap:
      name: collector-bench-config
  - name: config-out
    emptyDir: {}
  - name: data
    emptyDir: {}
---
