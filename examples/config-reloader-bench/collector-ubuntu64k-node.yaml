# Simplified Collector Pod with 0.18 (non-streaming) config-reloader on the Ubuntu arm64-linux64k (64k page size) node pool.
apiVersion: v1
kind: Pod
metadata:
  name: collector-ubuntu64k-018
  namespace: config-reloader-bench
  labels:
    app: collector
    bench: config-reloader
    reloader_version: v0.18-buffered
    node_type: ubuntu-arm64-64k
spec:
  nodeSelector:
    bench-node: ubuntu-64k
    kubernetes.io/arch: arm64
  tolerations:
  - key: bench-node
    operator: Equal
    value: ubuntu-64k
    effect: NoSchedule
  - key: kubernetes.io/arch
    operator: Equal
    value: arm64
    effect: NoSchedule
  containers:
  - name: config-reloader
    image: gke.gcr.io/prometheus-engine/config-reloader:v0.18.2-gke.1
    args:
    - --config-file=/prometheus/config/config.yaml.gz
    - --config-file-output=/prometheus/config_out/config.yaml
    - --reload-url=http://127.0.0.1:19090/-/reload
    - --ready-url=http://127.0.0.1:19090/-/ready
    - --listen-address=:19091
    env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: spec.nodeName
    ports:
    - name: cfg-rel-ins
      protocol: TCP
      containerPort: 19091
    resources:
      requests:
        cpu: 1m
        memory: 12Mi
      # 256Mi limit so we can measure actual RSS on 64k page size kernel without immediate OOMKill.
      limits:
        memory: 256Mi
    volumeMounts:
    - name: config
      mountPath: /prometheus/config
      readOnly: true
    - name: config-out
      mountPath: /prometheus/config_out
  - name: prometheus-noop
    image: gke.gcr.io/prometheus-engine/prometheus:v2.53.5-gmp.2-gke.2
    args:
    - --config.file=/prometheus/config/noop-prom.yaml
    - --storage.tsdb.path=/prometheus/data
    - --web.enable-lifecycle
    - --export.disable
    - --web.listen-address=127.0.0.1:19090
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 128Mi
    volumeMounts:
    - name: config
      mountPath: /prometheus/config
      readOnly: true
    - name: data
      mountPath: /prometheus/data
  volumes:
  - name: config
    configMap:
      name: collector-bench-config
  - name: config-out
    emptyDir: {}
  - name: data
    emptyDir: {}
---
