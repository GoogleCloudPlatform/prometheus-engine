apiVersion: apps/v1
kind: Deployment
metadata:
  name: rule-evaluator
  namespace: gmp-system
spec:
  template:
    spec:
      containers:
      - name: evaluator
        # The operator mounts the OperatorConfig credential at this path. Pointing Application Default
        # Credentials at it lets the container authenticate at startup, before its generated config (which
        # references the same file) is loaded; there's no metadata server to fall back on outside GKE.
        env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /etc/secrets/secret_gmp-public_gmp-wif-credentials_key.json
        volumeMounts:
        - name: ksa-token
          mountPath: /etc/ksa-token
          readOnly: true
      volumes:
      - name: ksa-token
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              audience: ${PROJECT_ID}.svc.id.goog
              expirationSeconds: 3600
              path: ksa-token
