# Deploys GMP managed collection on a Fleet-registered, non-GKE cluster, authenticating the collector and
# rule-evaluator with Fleet Workload Identity Federation. See README.md for the placeholders to fill in.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://raw.githubusercontent.com/GoogleCloudPlatform/prometheus-engine/v0.19.4-rc.0/manifests/setup.yaml
- https://raw.githubusercontent.com/GoogleCloudPlatform/prometheus-engine/v0.19.4-rc.0/manifests/operator.yaml
- wif-credentials.yaml
patches:
# Outside GKE there's no metadata server for the operator to discover the cluster's identity.
- target:
    kind: Deployment
    name: gmp-operator
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --project-id=${PROJECT_ID}
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --cluster=${MEMBERSHIP_NAME}
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --location=${LOCATION}
# Use the Workload Identity Federation credential for collection and rule evaluation.
- target:
    kind: OperatorConfig
    name: config
  patch: |-
    apiVersion: monitoring.googleapis.com/v1
    kind: OperatorConfig
    metadata:
      name: config
      namespace: gmp-public
    collection:
      credentials:
        name: gmp-wif-credentials
        key: key.json
    rules:
      credentials:
        name: gmp-wif-credentials
        key: key.json
# Mount a projected KSA token, which the credential exchanges for Google credentials.
- path: ksa-token-collector.yaml
- path: ksa-token-rule-evaluator.yaml
