apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: prom-example
  labels:
    app.kubernetes.io/name: prom-example
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prom-example
  endpoints:
  - port: metrics
    interval: 30s
  # Optional: Transfer pod labels or control metadata labels on scraped targets.
  # See examples/configuration/target-labels for detailed examples.
  # targetLabels:
  #   fromPod:
  #   - from: app
  #   - from: app.kubernetes.io/name
  #     to: app_name
  #   metadata:
  #   - pod
  #   - container
