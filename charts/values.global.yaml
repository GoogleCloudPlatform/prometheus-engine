commonLabels: false
namespace:
  public: gmp-public
  system: gmp-system
version: 0.17.3
images:
  # NOTE: All tags have to be quoted otherwise they might be treated as a number.
  bash:
    image: gke.gcr.io/gke-distroless/bash
    tag: "gke_distroless_20260815.00_p0"
  alertmanager:
    image: gke.gcr.io/prometheus-engine/alertmanager
    tag: "v0.27.0-gmp.10-gke.0"
  prometheus:
    image: gke.gcr.io/prometheus-engine/prometheus
    tag: "v3.13.0-gmp.3-gke.0@sha256:ef47e1228b3ffacf2fabbeb64208e57fc4ed0a7a98c7fc7c94abe6e029452d32"
  configReloader:
    image: gke.gcr.io/prometheus-engine/config-reloader
    tag: "v0.17.3-gke.0"
  operator:
    image: gke.gcr.io/prometheus-engine/operator
    tag: "v0.17.3-gke.0"
  ruleEvaluator:
    image: gke.gcr.io/prometheus-engine/rule-evaluator
    tag: "v0.17.3-gke.0"
  datasourceSyncer:
    image: gke.gcr.io/prometheus-engine/datasource-syncer
    tag: "v0.17.3-gke.0"
resources:
  alertManager:
    limits:
      memory: 128M
    requests:
      cpu: 1m
      memory: 16M
  bash:
    limits:
      memory: 32M
    requests:
      cpu: 1m
      memory: 4M
  collector:
    limits:
      memory: 2G
    requests:
      cpu: 4m
      memory: 32M
  configReloader:
    limits:
      memory: 32M
    requests:
      cpu: 1m
      memory: 4M
  operator:
    limits:
      memory: 2G
    requests:
      cpu: 1m
      memory: 16M
  ruleEvaluator:
    limits:
      memory: 1G
    requests:
      cpu: 1m
      memory: 16M
deployOperator: true
tls:
  base64:
    ca: null
    cert: null
    key: null
collector:
  rbac:
    create: true
  serviceAccount:
    create: true
operator:
  rbac:
    create: true
  serviceAccount:
    create: true
ruleEvaluator:
  rbac:
    create: true
  serviceAccount:
    create: true
    name: rule-evaluator
# Optional: passed to gmp-operator as --project-id, --cluster, and --location. Required when running
# outside GCE/GKE, where the GCE metadata server is unavailable. May be left empty on GKE.
projectId: ""
cluster: ""
location: ""
# Optional tolerations appended to the gmp-operator, rule-evaluator, and alertmanager pods.
tolerations: []
# Keyless Workload Identity Federation for collector and rule-evaluator on non-GKE clusters (e.g. Fleet
# attached clusters). When enabled, the chart creates an external_account credentials Secret in the public
# namespace, mounts a projected KSA token into collector and rule-evaluator, and references the Secret from
# OperatorConfig collection.credentials and rules.credentials.
#
# Do not enable on GKE: use GKE Workload Identity instead. The default audience uses the Fleet membership
# (gkehub.googleapis.com) identity provider, which GKE cluster memberships don't use.
#
# Required IAM (grant to the GSA instead when serviceAccountEmail is set). Note that rule-evaluator runs
# as the "collector" Kubernetes service account, so both components use the same principal:
#   principal://iam.googleapis.com/projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/<PROJECT_ID>.svc.id.goog/subject/ns/gmp-system/sa/collector
#   - roles/monitoring.metricWriter (collector and rule-evaluator export)
#   - roles/monitoring.viewer (rule-evaluator queries)
workloadIdentity:
  enabled: false
  # Projected KSA token audience. Defaults to "<projectId>.svc.id.goog".
  tokenAudience: ""
  tokenExpirationSeconds: 172800
  # STS audience. Defaults to the Fleet membership identity provider:
  # identitynamespace:<projectId>.svc.id.goog:https://gkehub.googleapis.com/projects/<projectId>/locations/<membershipLocation>/memberships/<membershipName>
  # Set explicitly for other providers (e.g. an IAM Workload Identity Pool provider).
  audience: ""
  # Fleet membership name. Defaults to cluster.
  membershipName: ""
  membershipLocation: "global"
  # Optional GSA to impersonate (e.g. for VPC Service Controls). Requires roles/iam.workloadIdentityUser
  # on the GSA for the principal above.
  serviceAccountEmail: ""
  # Name of the generated credentials Secret in the public namespace.
  secretName: "gmp-wif-creds"
